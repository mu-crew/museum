name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false # no lockfile to key it on; four pinned wheels
      - run: make check
      - run: make test PYTHON="uv run --no-project --python 3.11 python"
